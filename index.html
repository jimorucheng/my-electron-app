<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title></title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #ffffff; /* ✅ 防止闪烁 */
      }
      #myWebview {
        width: 100%;
        height: 100%;
        border: none;
        background: #ffffff;
      }
    </style>
  </head>
  <body>
    <!-- webview src 由外部配置文件动态设置 -->
    <webview
      id="myWebview"
      src="about:blank"
      allowpopups
      style="background: #fff"
      partition="nopersist"
      preload="./preload.js"
    ></webview>

    <script>
      // 获取webview元素
      const webViewElement = document.querySelector("webview");

      // webview src 由主进程注入（从外部配置文件读取）

      // 监听加载成功
      webViewElement.addEventListener("did-finish-load", () => {
        console.log("H5页面加载完成");
      });

      // 监听加载失败
      webViewElement.addEventListener(
        "did-fail-load",
        (event, errorCode, errorDescription) => {
          console.error("H5页面加载失败：", errorCode, errorDescription);
        }
      );

      // 监听来自H5页面的消息
      webViewElement.addEventListener("ipc-message", (event) => {
        if (event.channel === "close-app") {
          // 转发消息给主进程关闭窗口
          window.electronAPI.closeWindow();
        }
      });
    </script>
  </body>
</html>
